<!-- Code Block Copy Button -->
<style>
  .copy-code-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #c9d1d9;
    background-color: rgba(33, 38, 45, 0.85);
    border: 1px solid rgba(240, 246, 252, 0.15);
    border-radius: 6px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all 0.2s ease-in-out;
    z-index: 10;
    user-select: none;
  }
  .copy-code-btn:hover {
    background-color: rgba(48, 54, 61, 0.95);
    border-color: rgba(140, 149, 159, 0.4);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .copy-code-btn.copied {
    background-color: rgba(22, 27, 34, 0.95);
    border-color: rgba(34, 197, 94, 0.5);
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
  }
  .copy-code-btn svg {
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  .copy-code-btn:active svg {
    transform: scale(0.9);
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const codeBlocks = document.querySelectorAll('div.highlighter-rouge, figure.highlight, pre');
    const processed = new Set();

    codeBlocks.forEach(function(block) {
      let pre = block.tagName.toLowerCase() === 'pre' ? block : block.querySelector('pre');
      if (!pre || processed.has(pre)) return;
      processed.add(pre);

      let container = pre.parentElement;
      if (!container || container.tagName.toLowerCase() === 'code' || container.tagName.toLowerCase() === 'pre') {
        container = pre;
      }
      container.style.position = 'relative';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-code-btn';
      copyBtn.setAttribute('aria-label', 'Copy code to clipboard');
      copyBtn.innerHTML = `
        <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 2 0 0 1-2-2V4a2 2 2 0 0 1 2-2h9a2 2 2 0 0 1 2 2v1"></path>
        </svg>
        <span class="copy-text">Copy</span>
      `;

      copyBtn.addEventListener('click', function() {
        const code = pre.querySelector('code') || pre;
        const textToCopy = code.innerText.trim();

        navigator.clipboard.writeText(textToCopy).then(function() {
          copyBtn.classList.add('copied');
          copyBtn.innerHTML = `
            <svg class="check-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span class="copy-text" style="color: #22c55e;">Copied!</span>
          `;
          setTimeout(function() {
            copyBtn.classList.remove('copied');
            copyBtn.innerHTML = `
              <svg class="copy-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 2 0 0 1-2-2V4a2 2 2 0 0 1 2-2h9a2 2 2 0 0 1 2 2v1"></path>
              </svg>
              <span class="copy-text">Copy</span>
            `;
          }, 2000);
        }).catch(function(err) {
          console.error('Failed to copy: ', err);
        });
      });

      container.appendChild(copyBtn);
    });
  });
</script>
